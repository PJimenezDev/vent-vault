services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-bO9Xz8g1n3R_kL4pY7sV2wM6tJ0qF5hC8uD1xA9vE_c=} 
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
    # Agregamos --reload para que FastAPI se actualice solo al guardar cambios
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: