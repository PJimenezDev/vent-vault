<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vent Vault</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="vault-container">
        <h1>Vent Vault</h1>

        <p class="subtitle">
            Desahógate. Todo es anónimo. Todo desaparece.
        </p>

        <textarea
            id="ventInput"
            rows="8"
            maxlength="1000"
            placeholder="Escribe aquí aquello que necesitas sacar de tu mente..."
        ></textarea>

        <button onclick="sendVent()">
            Sellar en la bóveda
        </button>

        <p id="statusMessage"></p>
    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
